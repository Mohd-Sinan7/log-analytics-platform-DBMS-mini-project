services:
  postgres:
    image: postgres:16-alpine
    container_name: log_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logs}
      POSTGRES_USER: ${POSTGRES_USER:-logs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logspassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/002_partitions.sql:/docker-entrypoint-initdb.d/002_partitions.sql:ro
      - ./db/003_indexes.sql:/docker-entrypoint-initdb.d/003_indexes.sql:ro
      - ./db/004_rollups.sql:/docker-entrypoint-initdb.d/004_rollups.sql:ro
      - ./db/005_anomalies.sql:/docker-entrypoint-initdb.d/005_anomalies.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logs} -d ${POSTGRES_DB:-logs}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: log_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  grafana:
    image: grafana/grafana:10.4.2
    container_name: log_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./dashboards/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./dashboards/log_analytics.json:/var/lib/grafana/dashboards/log_analytics.json:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: log_api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-logs}
      POSTGRES_USER: ${POSTGRES_USER:-logs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logspassword}
      ES_HOST: http://elasticsearch:9200
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    volumes:
      - ./api:/app/api
      - ./ingest:/app/ingest
      - ./anomaly:/app/anomaly
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    container_name: log_ingest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-logs}
      POSTGRES_USER: ${POSTGRES_USER:-logs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logspassword}
      ES_HOST: http://elasticsearch:9200
      LOG_FILE: /var/log/app/app.log
    volumes:
      - log_data:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  anomaly:
    build:
      context: .
      dockerfile: anomaly/Dockerfile
    container_name: log_anomaly
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-logs}
      POSTGRES_USER: ${POSTGRES_USER:-logs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logspassword}
      ANOMALY_ZSCORE_THRESHOLD: "3.0"
      ANOMALY_MIN_COUNT: "5"
      ANOMALY_INTERVAL: "60"
    depends_on:
      postgres:
        condition: service_healthy

  generator:
    build:
      context: .
      dockerfile: generator/Dockerfile
    container_name: log_generator
    restart: "no"
    volumes:
      - log_data:/var/log/app
    profiles:
      - gen

volumes:
  postgres_data:
  es_data:
  grafana_data:
  log_data:
