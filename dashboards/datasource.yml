apiVersion: 1

datasources:
  - name: PostgresLogs
    uid: PostgresLogs
    type: postgres
    url: postgres:5432
    user: logs
    secureJsonData:
      password: logspassword
    jsonData:
      database: logs
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
